syntax = "proto3";

package gobackup;

option go_package = "gobackup/internal/grpc/pb";

// The core backup orchestration service
service BackupService {
    // Triggers a backup for a specific host or group
    rpc StartBackup (BackupRequest) returns (BackupResponse);

    // Streams real-time logs for active backups (TUI integration)
    rpc WatchLogs (WatchRequest) returns (stream LogChunk);

    // Retrieves current running jobs and daemon status
    rpc GetStatus (StatusRequest) returns (StatusResponse);

    // List all configured hosts
    rpc ListHosts (ListRequest) returns (ListResponse);
    rpc ListBackups (ListBackupsRequest) returns (ListBackupsResponse);
    // Manually trigger retention cleanup
    rpc PruneBackups (PruneRequest) returns (PruneResponse);
}

// Admin service for configuration and token management
service AdminService {
    // Requires Local Socket God-Mode to generate auth tokens
    rpc GenerateToken (GenerateTokenRequest) returns (GenerateTokenResponse);
    
    // Dynamically adds a new host configuration and triggers GitOps sync
    rpc AddHost (AddHostRequest) returns (AddHostResponse);
}

// --- Messages ---

message BackupRequest {
    string target = 1; // "kvm01" or "production_group"
}

message BackupResponse {
    bool success = 1;
    string message = 2;
    string job_id = 3;
}

message WatchRequest {
    // Optional: Watch a specific job, or leave empty to watch all current activity
    string job_id = 1;
}

message LogChunk {
    string text = 1;
    bool is_summary = 2; // if true, this goes to the top summary window instead of the raw scrolling log
    string host_name = 3; 
}

message StatusRequest {}

message StatusResponse {
    int32 active_jobs = 1;
    string uptime = 2;
}

message GenerateTokenRequest {
    string username = 1;
    string role = 2; // e.g., "admin" or "viewer"
}

message GenerateTokenResponse {
    string token = 1;
}

message AddHostRequest {
    string name = 1;
    string group = 2;
    string address = 3;
    int32 port = 4;
    bool use_sudo = 5;
    int32 retention_count = 6;
    repeated string paths = 7;
    string schedule = 8;
}

message AddHostResponse {
    bool success = 1;
    string message = 2;
}
message ListRequest {}
message HostInfo {
    string name = 1;
    string address = 2;
    string schedule = 3;
    int32 retention_count = 4;
}
message ListResponse {
    repeated HostInfo hosts = 1;
}

message PruneRequest {}
message PruneResponse {
    bool success = 1;
    string message = 2;
}
message ListBackupsRequest {
    string target = 1;
}
message BackupArchive {
    string host = 1;
    string filename = 2;
    int64 size = 3;
    string modified = 4;
}
message ListBackupsResponse {
    repeated BackupArchive archives = 1;
}

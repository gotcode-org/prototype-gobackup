syntax = "proto3";

package gobackup;

option go_package = "gobackup/internal/grpc/pb";

// The core backup orchestration service
service BackupService {
    // Triggers a backup for a specific host or group
    rpc StartBackup (BackupRequest) returns (BackupResponse);

    // Streams real-time logs for active backups (TUI integration)
    rpc WatchLogs (WatchRequest) returns (stream LogChunk);

    // Retrieves current running jobs and daemon status

    // List all configured hosts
    rpc ListServers (ListRequest) returns (ListServerResponse);
    rpc ListJobs (ListRequest) returns (ListJobResponse);
    rpc ListBackups (ListBackupsRequest) returns (ListBackupsResponse);
    rpc GetStatus (StatusRequest) returns (StatusResponse);
    // Manually trigger retention cleanup
    rpc PruneBackups (PruneRequest) returns (PruneResponse);
}

// Admin service for configuration and token management
service AdminService {
    // Requires Local Socket God-Mode to generate auth tokens
    rpc GenerateToken (GenerateTokenRequest) returns (GenerateTokenResponse);
    
    // Dynamically adds a new host configuration and triggers GitOps sync
    rpc AddServer (AddServerRequest) returns (GenericResponse);
    rpc AddJob (AddJobRequest) returns (GenericResponse);
    rpc RemoveServer (RemoveServerRequest) returns (GenericResponse);
    rpc RemoveJob (RemoveJobRequest) returns (GenericResponse);
    rpc RemoveBackup (RemoveBackupRequest) returns (GenericResponse);
    rpc RestoreBackup (RestoreBackupRequest) returns (stream RestoreLogChunk);
}

// --- Messages ---


message RestoreBackupRequest {
    string filename = 1;
    string target_path = 2;
  string target_vol = 3;
}

message RestoreLogChunk {
    string content = 1;
    string status = 2;
}

message BackupRequest {
    string target_server = 1;
    string target_job = 2;
}

message BackupResponse {
    bool success = 1;
    string message = 2;
    string job_id = 3;
}

message WatchRequest {
    // Optional: Watch a specific job, or leave empty to watch all current activity
    string job_id = 1;
}

message LogChunk {
    string text = 1;
    bool is_summary = 2; // if true, this goes to the top summary window instead of the raw scrolling log
    string host_name = 3;
    bool is_status = 4;
    bool spinning = 5;
}



message GenerateTokenRequest {
    string username = 1;
    string role = 2; // e.g., "admin" or "viewer"
}

message GenerateTokenResponse {
    string token = 1;
}

message ListRequest {}

message PruneRequest {}
message PruneResponse {
    bool success = 1;
    string message = 2;
}
message ListBackupsRequest {
    string target = 1;
    string tier = 2;
}
message BackupArchive {
    string job = 1;
    string filename = 2;
    int64 size = 3;
    string modified = 4;
    string type = 5;
    string server = 6;
    string archive_type = 7;
    string tier = 8;
}
message ListBackupsResponse {
    repeated BackupArchive archives = 1;
}

message StatusRequest {}
message UpcomingJob {
    string job = 1;
    string schedule = 2;
    string next_run = 3;
    int64 next_unix = 4;
    string server = 5;
}

message StatusResponse {
    bool online = 1;
    string active_job = 2;
    repeated string queued_jobs = 3;
    repeated UpcomingJob upcoming_jobs = 4;
    int64 disk_total = 5;
    int64 disk_used = 6;
    int64 disk_free = 7;
    int32 total_backups = 8;
}

message RemoveBackupRequest {
    string filename = 1;
}
message GenericResponse {
    bool success = 1;
    string message = 2;
}

message AddServerRequest {
    string name = 1;
    string group = 2;
    string address = 3;
    int32 port = 4;
    bool use_sudo = 5;
}

message AddJobRequest {
    string name = 1;
    string server = 2;
    string schedule = 3;
    int32 retention_count = 4;
    repeated string paths = 5;
    repeated string docker_volumes = 6;
    repeated string pause_containers = 7;
    bool incremental = 8;
    int32 full_interval = 9;
    string cold_storage_path = 10;
    int32 cold_storage_retention = 11;
    string hot_storage_path = 12;
}

message ServerInfo {
    string name = 1;
    string group = 2;
    string address = 3;
    int32 port = 4;
    bool use_sudo = 5;
}

message JobInfo {
    string name = 1;
    string server = 2;
    string schedule = 3;
    int32 retention_count = 4;
    bool incremental = 5;
    int32 full_interval = 6;
    string cold_storage_path = 7;
    int32 cold_storage_retention = 8;
    string hot_storage_path = 9;
}

message ListServerResponse {
    repeated ServerInfo servers = 1;
}

message ListJobResponse {
    repeated JobInfo jobs = 1;
}

message RemoveServerRequest {
    string name = 1;
}

message RemoveJobRequest {
    string name = 1;
    string server = 2;
}
